<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dompetku – Budgeting Keuangan</title>
<style>
:root{--bg:#fff;--shell:#fff;--side:#f6f8f7;--card:#fff;--tx:#14201a;--mut:#6f7c75;--bd:#e6ebe8;--g1:#1f9d62;--g2:#168a55;--good:#1f9d62;--bad:#e5484d;--in:#f4f6f5;--hb:#eef2f0;--hl:#b9c8bf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:14px}
.shell{max-width:none;margin:12px;background:var(--shell);border-radius:28px;border:1px solid var(--bd);padding:12px;display:grid;grid-template-columns:230px 1fr;gap:12px}
.side{background:var(--side);border-radius:20px;padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-height:640px}
.logo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:18px;margin-bottom:22px;padding-left:6px}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--g1);display:grid;place-items:center;color:#fff;font-style:normal}
.side small{color:var(--mut);font-size:11px;letter-spacing:.5px;padding-left:10px;margin:8px 0 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--mut);text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nav.on{color:var(--tx);font-weight:bold;border-left-color:var(--g1)}
.sync{margin-top:auto;border-radius:16px;padding:16px;color:#fff;background:linear-gradient(150deg,#34c07f,#1f9d62)}
.sync b{display:block;margin-bottom:6px}.sync span{font-size:12px;opacity:.9}
.main{background:var(--side);border-radius:20px;padding:20px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h1{margin:0;font-size:30px}.sub{color:var(--mut);margin:4px 0 0}
.acts{display:flex;gap:8px;align-items:center}
select,input,button{font:inherit;color:var(--tx)}
input,select{background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
select option{color:#14201a;background:#fff}
.acts select{width:auto;background:var(--card);border-radius:999px;padding:10px 14px}
.btn{background:linear-gradient(135deg,#34c07f,#1a9158);color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{background:var(--card);border-radius:16px;padding:16px;min-width:0;margin-bottom:12px}
.cards .c{margin:0}
.c h3{margin:0 0 10px;font-size:15px}
.hero{background:linear-gradient(135deg,#3cc888,#1f9d62);color:#fff}
.big{font-size:26px;font-weight:bold;margin:6px 0 10px;white-space:nowrap;overflow:hidden}
.chip{font-size:11px;color:var(--g1)}.hero .chip{color:#fff}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.r2{grid-row:span 2}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:pointer;font-size:11px;color:var(--mut)}
.b{width:100%;max-width:34px;border-radius:999px;background:#7fb3f5}
.b.dk{background:#2563eb}
.b.hs{background:repeating-linear-gradient(45deg,var(--hb) 0 4px,var(--hl) 4px 5px)}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.it .iv{min-width:0;flex:1}.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ir{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ir span{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.ir em{font-style:normal;font-weight:bold;white-space:nowrap;flex:none}
.tg{margin-bottom:14px}.tg .h{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin-bottom:6px}
.tg input{text-align:right;padding:5px 8px}
.pb{height:10px;border-radius:999px;background:repeating-linear-gradient(45deg,var(--hb) 0 4px,var(--hl) 4px 5px);overflow:hidden}
.pb i{display:block;height:100%;background:var(--g1);border-radius:999px}.pb i.o{background:var(--bad)}
.tg small,.mut{color:var(--mut);font-size:12px}
.dark{background:linear-gradient(135deg,#5b8def,#7c5cf0);color:#fff;display:flex;flex-direction:column;justify-content:center}
.dark .big{font-size:30px}
.gauge{text-align:center}.gauge svg{width:100%;max-width:240px}
.ph{color:var(--mut);padding:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.ri{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) 30px}.re{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 124px 30px}.rc{grid-template-columns:1fr 64px 92px 30px}
.x{background:none;border:1px solid var(--bd);border-radius:8px;color:var(--mut);cursor:pointer;padding:6px 8px}
.add{width:100%;margin-top:6px;background:none;border:1px dashed var(--hl);border-radius:8px;padding:9px;cursor:pointer}
.add.in{width:auto;margin:0 6px 0 0;padding:8px 14px}
.ck{display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}.ck input{width:auto}
.sc{overflow-x:auto}
.tb{border-collapse:collapse;width:100%;min-width:520px}
.tb th,.tb td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;height:48px}
.tb th{background:var(--in);font-size:12px;color:var(--mut)}
.tb input[type=checkbox]{width:20px;height:20px}
.tb tr.dn td,.tb tr.dn input{color:var(--mut)}
.tb tfoot td{font-weight:bold}
.tb .num{text-align:right}
.hd{display:flex;gap:4px;align-items:center}.hd input{font-weight:bold}
.tw{display:flex;gap:12px;align-items:flex-start}.tw .sc:first-child{flex:none}.tw .sc:last-child{flex:1}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
summary{cursor:pointer;font-weight:bold;padding:4px 0}
.leg{display:flex;flex-direction:column;gap:8px;min-width:200px;flex:1}
.leg div{display:flex;gap:8px;align-items:center}.leg em{margin-left:auto;font-style:normal;white-space:nowrap}
.dn2{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.pair{display:flex;gap:4px;align-items:flex-end;height:100%;justify-content:center;width:100%}
.pair .b{max-width:30px}
.pair{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:100%}.pair .b{max-width:30px}.bv{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:46px;font-size:10px;color:var(--mut);gap:2px}
.good{color:var(--good)}.badc{color:var(--bad)}.chip.good{color:var(--good)}.chip.badc{color:var(--bad)}
.tb.jl{min-width:100px;width:100px}.jl td,.jl th{white-space:nowrap}.tb.jr{min-width:0}.jr th{min-width:120px}
.tb.rk{min-width:0;table-layout:fixed}.rk td,.rk th{height:auto;padding:8px 4px;font-size:11px;vertical-align:top}.rk td.num{white-space:nowrap}.rk td:first-child{white-space:normal}.rk th{text-align:right}.rk th:first-child,.rk td:first-child{width:28%;text-align:left}.rk .pb{height:6px;margin:4px 0}
.ic{display:inline-block;width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}.bnav .ic{width:22px;height:22px}.nav.on .ic,.bnav a.on .ic{background:var(--g1)}

/* ===== revisi tipografi & mobile fit ===== */
.tb.dbt{table-layout:fixed}.dbt th:nth-child(1),.dbt td:nth-child(1){width:104px}.dbt th:nth-child(3),.dbt td:nth-child(3){width:42%}.dbt input{padding:8px 6px;font-size:13.5px}
@media (max-width:620px){.dbt th:nth-child(1),.dbt td:nth-child(1){width:88px}.dbt th:nth-child(3),.dbt td:nth-child(3){width:44%}.dbt td,.dbt th{padding:4px 3px}}
body{line-height:1.5}
.c h3{font-size:17px;line-height:1.35;margin:0 0 12px}
.c b{font-size:1.1em}
.c p{line-height:1.6;margin:6px 0 12px}
.mut{line-height:1.55}
.sub{font-size:15px}
.chip{font-size:12.5px;line-height:1.5}
.tg small{font-size:13px;line-height:1.55}.tg .h b{font-size:16px}
.it .ir span{font-size:12.5px}
.tb:not(.rk) th{font-size:13px}
.gg{gap:12px}.gg svg{margin:6px 0}.gg small{display:block;font-size:12.5px;line-height:1.5;margin-top:10px}.gg>div>b{display:block;margin:2px 0}
.lgd{font-size:12.5px;line-height:1.7;gap:8px 18px;margin:10px 0 18px}
.ri input,.re input,.rx input{padding:8px 7px}
.sh{display:none}
.tb.sis{table-layout:fixed;min-width:0}.sis th:nth-child(1),.sis td:nth-child(1){width:10%}.sis th:nth-child(2),.sis td:nth-child(2){width:30%;overflow-wrap:anywhere}
@media (max-width:620px){
 .tb.tgt,.tb.tgt tbody{display:block;width:100%;min-width:0}
 .tb.tgt tr.ih{display:none}
 .tb.tgt tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}

 .tb.tgt td.tn{grid-column:1/3;font-weight:bold;color:var(--mut);font-size:13px}.tb.tgt td.tn::before{content:"Target "}
 .tb.tgt td:nth-child(2),.tb.tgt td.tp{grid-column:1/3}

 .tb.tgt td[data-l]:not(.tn)::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut);margin-bottom:3px}

/* ===== layar login ===== */
.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}.auth[hidden]{display:none}
.ac{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px}
.alogo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:20px;margin-bottom:18px}
.alogo i{width:34px;height:34px;border-radius:50%;background:var(--g1);display:grid;place-items:center;color:#fff;font-style:normal}
.ac h2{margin:0 0 4px;font-size:22px}.ac .mut{margin:4px 0 0}
.ac label{display:block;font-size:13px;color:var(--mut);margin:14px 0 4px}
.ac input{font-size:16px;padding:11px 12px}
.amsg{min-height:20px;margin:12px 0;font-size:13.5px;line-height:1.5}.amsg.err{color:var(--bad)}.amsg.ok{color:var(--good)}

.alinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.lnk{background:none;border:0;color:var(--g1);cursor:pointer;font-size:13.5px;padding:4px 0}
.who{font-size:12.5px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outb{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:10px 16px;cursor:pointer}

/* ===== tombol keluar & kartu berwarna ===== */
.main{position:relative}
.acct{position:absolute;top:20px;right:20px;display:none;align-items:center;gap:10px;z-index:3}
.outb{display:flex;align-items:center;justify-content:center;padding:8px;border-radius:50%}
.outb img{display:block}
.hero.red{background:linear-gradient(135deg,#dd7157 0%,#c14138 55%,#992120 100%)}

.navout{margin-top:auto;display:flex;justify-content:center;align-items:center;width:44px;height:44px;border:0;border-radius:12px;background:transparent;cursor:pointer;padding:0}.navout:hover{background:var(--card)}

function morph(a,b){
  for(var i=0;i<b.childNodes.length;i++){var x=a.childNodes[i],y=b.childNodes[i];
    if(!x){a.appendChild(y.cloneNode(true));continue}

    if(x.nodeType!==1)continue;var n;
    for(n=x.attributes.length-1;n>=0;n--){if(!y.hasAttribute(x.attributes[n].name))x.removeAttribute(x.attributes[n].name)}
    for(n=0;n<y.attributes.length;n++){var q=y.attributes[n];if(x.getAttribute(q.name)!==q.value)x.setAttribute(q.name,q.value)}
    if(x.nodeName==="INPUT"){if(x.type==="checkbox")x.checked=y.hasAttribute("checked");else if(x!==document.activeElement)x.value=y.getAttribute("value")||"";continue}
    morph(x,y);
    if(x.nodeName==="SELECT"){var o=y.querySelector("option[selected]");if(o)x.value=o.value}
  }
  while(a.childNodes.length>b.childNodes.length)a.removeChild(a.lastChild)}
